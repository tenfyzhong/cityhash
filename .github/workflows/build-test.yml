name: go
on:
  push:
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      matrix:
        go-version: ['1.26.10', '1.27.3']
    uses: tenfyzhong/workflows/.github/workflows/go-build-test.yml@468e08546cefd77d8f6ec41402afce1d9bbd8c72
    with: 
      go-version: ${{matrix.go-version}}

    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
